name: Update library
on:
  workflow_dispatch:
    inputs:
      mode:
        description: What would you like to do?
        type: choice
        options: [Update library, Publish website only, Check YouTube captions]
        default: Update library
      playlist_url:
        description: YouTube playlist link (first update only; leave blank to reuse)
        type: string
        required: false
      model:
        description: Model (all use your OpenCode Zen API key)
        type: choice
        options:
          - opencode/gemini-3.5-flash-lite
          - opencode/deepseek-v4.1-flash
          - opencode/gemini-3-flash
        default: opencode/gemini-3.5-flash-lite
      max_videos:
        description: Maximum new videos this run (1–10; smaller batches cost less)
        type: choice
        options: ['1', '3', '5', '10']
        default: '3'
      test_video:
        description: Video ID for caption check only (no AI charge)
        type: string
        default: jNQXAC9IVRw
permissions:
  contents: read
concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      failures: ${{ steps.update.outputs.failures }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install tools
        run: |
          npm ci
          python -m pip install -r requirements.txt
      - name: Check pipeline
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.test.mjs
      - name: Check captions without calling AI
        if: inputs.mode == 'Check YouTube captions'
        env:
          TEST_VIDEO: ${{ inputs.test_video }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: python scripts/pipeline.py --transcript-check "$TEST_VIDEO"
      - name: Fetch transcripts and generate summaries
        id: update
        if: inputs.mode == 'Update library'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          PLAYLIST_URL: ${{ inputs.playlist_url }}
          MODEL: ${{ inputs.model }}
          MAX_VIDEOS: ${{ inputs.max_videos }}
        run: python scripts/pipeline.py
      - name: Save library to this repository
        if: inputs.mode == 'Update library'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.json data/videos.json data/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update video library'
            gh auth setup-git
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Build website
        if: inputs.mode != 'Check YouTube captions'
        run: python scripts/render_site.py
      - uses: actions/upload-pages-artifact@v4
        if: inputs.mode != 'Check YouTube captions'
        with:
          path: public
  deploy:
    if: inputs.mode != 'Check YouTube captions'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report failed videos after publishing successful summaries
        if: needs.build.outputs.failures != '' && needs.build.outputs.failures != '0'
        run: |
          echo 'Some videos failed. Successful summaries were published. See the build job summary for retry instructions.'
          exit 1
